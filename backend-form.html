<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex,nofollow">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Brooklyn Bikery - Service Entry</title>

  <link rel="icon" type="image/png" sizes="512x512" href="https://brooklynbikery.com/favicon.png">
  <link rel="icon" type="image/x-icon" href="https://brooklynbikery.com/favicon.ico">
  <link rel="apple-touch-icon" href="https://brooklynbikery.com/favicon.png">

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.471.0/dist/umd/lucide.min.js" integrity="sha384-KpXDE5oKROGQ3ToUTkqvxct6xiG7LCgmHGqMVTiaPvoebtWQ4xoOPY3Zo4+DoZ9n" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, #5b6fcc 0%, #6e83f5 100%);
      background-attachment: fixed;
      padding: 2rem 1rem;
      min-height: 100vh;
      -webkit-overflow-scrolling: touch;
    }

    /* Lucide icon defaults */
    [data-lucide] {
      display: inline-block;
      vertical-align: middle;
      stroke-width: 2;
    }
    .icon-lg [data-lucide] { width: 56px; height: 56px; }
    .icon-md [data-lucide] { width: 22px; height: 22px; }
    .icon-sm [data-lucide] { width: 16px; height: 16px; }

    .login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .login-box {
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 3rem 2.5rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      animation: slideUp 0.4s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-box h2 {
      font-size: 1.9rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
      letter-spacing: -0.4px;
      background: linear-gradient(135deg, #1a1d29 0%, #5b6fcc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .login-box p { color: #666; margin-bottom: 2rem; font-size: 1rem; }

    .login-form { display: flex; flex-direction: column; gap: 1rem; }

    .login-form input {
      padding: 1rem;
      font-size: 1.05rem;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      transition: all 0.3s ease;
    }

    .login-form input:focus {
      outline: none;
      border-color: #5b6fcc;
      box-shadow: 0 0 0 4px rgba(91, 111, 204, 0.1);
    }

    .login-form button {
      padding: 1rem;
      font-size: 1.1rem;
      font-weight: 700;
      background: linear-gradient(135deg, #5b6fcc 0%, #6e83f5 100%);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Outfit', sans-serif;
      box-shadow: 0 4px 15px rgba(91, 111, 204, 0.4);
      margin-top: 0.5rem;
    }

    .login-form button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(91, 111, 204, 0.5);
    }

    .login-form button:disabled {
      background: #ccc;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .error-message {
      background: #fee;
      color: #c33;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.95rem;
      display: none;
      border: 1px solid #fcc;
    }

    .error-message.show { display: block; }

    .main-app { display: none; }
    .main-app.active { display: block; }

    /* Top Header Bar (static, scrolls with page) */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      margin: -2rem -1rem 1.5rem -1rem;
      position: relative; /* anchor the absolutely-centered shop name */
    }

    /* Mobile: the absolutely-centered shop name overlaps the switcher + Logout on
       narrow screens. Reflow it onto its own centered row beneath them. */
    @media (max-width: 600px) {
      .top-header { flex-wrap: wrap; row-gap: 0.4rem; }
      #shopName {
        position: static !important;
        transform: none !important;
        order: 3;
        flex-basis: 100%;
        max-width: 100%;
        text-align: center;
        font-size: 1rem !important;
      }
    }

    .form-switcher {
      display: flex;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 3px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .form-switcher a {
      padding: 0.45rem 0.9rem;
      border-radius: 9px;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.85);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .form-switcher a:hover {
      color: white;
      background: rgba(255, 255, 255, 0.1);
    }

    .form-switcher a.active {
      background: white;
      color: #5b6fcc;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
    }

    .form-switcher a .icon {
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
    }
    .form-switcher a .icon [data-lucide] {
      width: 14px;
      height: 14px;
      stroke-width: 2.4;
    }

    .logout-btn {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 0.45rem 1rem;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.8rem;
      font-family: 'Outfit', sans-serif;
    }

    .logout-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .header-section { text-align: center; margin-bottom: 2rem; }

    .header-section h2 {
      font-size: 2.1rem;
      font-weight: 700;
      color: white;
      text-shadow: 0 2px 12px rgba(0,0,0,0.25);
      letter-spacing: -0.4px;
      margin: 0;
    }

    .lookup-box {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      padding: 1.5rem;
      max-width: 600px;
      margin: 0 auto 1.5rem auto;
    }

    .lookup-box label {
      display: block;
      margin-bottom: 1rem;
      font-weight: 600;
      color: #333;
    }
    .lookup-box label [data-lucide],
    .update-customer-grid label [data-lucide] {
      width: 16px;
      height: 16px;
      color: #5b6fcc;
      stroke-width: 2.2;
      vertical-align: -3px;
      margin-right: 0.35rem;
    }
    .mode-toggle-btn [data-lucide] {
      width: 14px;
      height: 14px;
      stroke-width: 2.6;
      vertical-align: -2px;
      margin-right: 0.25rem;
    }
    .nc-badge [data-lucide] {
      width: 14px;
      height: 14px;
      stroke-width: 2.6;
      vertical-align: -2px;
      margin-right: 0.3rem;
    }
    .logout-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .logout-btn [data-lucide] {
      width: 14px;
      height: 14px;
      stroke-width: 2.4;
    }

    .lookup-box input {
      width: 100%;
      padding: 0.875rem 1rem;
      font-size: 1rem;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      margin-top: 0.5rem;
      transition: all 0.3s ease;
      background: #fafafa;
      font-family: 'Outfit', sans-serif;
    }

    .lookup-box input:focus {
      outline: none;
      border-color: #5b6fcc;
      box-shadow: 0 0 0 4px rgba(91, 111, 204, 0.1);
      background: white;
    }

    /* Update Customer Info Section */
    .update-customer-section {
      margin-top: 1rem;
      border: 2px solid #e8ebff;
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .update-customer-section:hover {
      border-color: #c5cdff;
    }

    .update-customer-section.expanded {
      border-color: #5b6fcc;
      background: linear-gradient(135deg, #f8f9ff 0%, #f0f3ff 100%);
    }

    .update-customer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.875rem 1rem;
      cursor: pointer;
      background: #f8f9ff;
      transition: all 0.3s ease;
      user-select: none;
    }

    .update-customer-header:hover {
      background: #f0f3ff;
    }

    .update-customer-section.expanded .update-customer-header {
      background: transparent;
      border-bottom: 2px solid #e8ebff;
    }

    .update-customer-title {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 600;
      color: #5b6fcc;
      font-size: 0.95rem;
    }

    .update-customer-title .icon {
      font-size: 1.1rem;
      display: inline-flex;
      align-items: center;
    }
    .update-customer-title .icon [data-lucide] {
      width: 18px;
      height: 18px;
      color: #5b6fcc;
      stroke-width: 2.2;
    }

    .update-customer-arrow {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #5b6fcc 0%, #6e83f5 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      transition: all 0.3s ease;
      box-shadow: 0 2px 6px rgba(91, 111, 204, 0.35);
    }
    .update-customer-arrow [data-lucide] {
      width: 16px;
      height: 16px;
      stroke-width: 2.6;
    }

    .update-customer-section.expanded .update-customer-arrow {
      transform: rotate(180deg);
      background: #4d62b8;
    }

    .update-customer-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, padding 0.3s ease;
    }

    .update-customer-section.expanded .update-customer-body {
      max-height: 300px;
      padding: 1rem;
    }

    .update-customer-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .update-customer-grid label {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      font-weight: 600;
      color: #444;
      font-size: 0.9rem;
    }

    .update-customer-grid input {
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-family: 'Outfit', sans-serif;
      transition: all 0.3s ease;
      background: white;
    }

    .update-customer-grid input:focus {
      outline: none;
      border-color: #5b6fcc;
      box-shadow: 0 0 0 3px rgba(91, 111, 204, 0.1);
    }

    .update-customer-grid input::placeholder {
      color: #aaa;
    }

    .service-section {
      background: white;
      border-radius: 24px;
      padding: 2rem;
      max-width: 900px;
      margin: 0 auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .category {
      border: 2px solid #e8ebff;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      background: #f8f9ff;
      transition: all 0.3s ease;
    }

    .category:hover {
      border-color: #5b6fcc;
      background: #f0f3ff;
    }

    .category legend {
      font-weight: 700;
      padding: 0 0.75rem;
      color: #5b6fcc;
      font-size: 1.1rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .category legend [data-lucide] {
      width: 20px;
      height: 20px;
      color: #5b6fcc;
      stroke-width: 2.2;
    }

    .category label {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 0;
      font-size: 1.05rem;
      cursor: pointer;
    }

    .category input[type="checkbox"] {
      width: 1.5rem;
      height: 1.5rem;
      accent-color: #5b6fcc;
    }

    .category input[type="number"],
    .category input[type="text"] {
      padding: 0.6rem;
      font-size: 1rem;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-family: 'Outfit', sans-serif;
    }

    .two-column-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .column-header {
      font-weight: 700;
      color: #5b6fcc;
      font-size: 1rem;
      padding: 0.5rem;
      text-align: center;
      background: rgba(91, 111, 204, 0.1);
      border-radius: 8px;
      margin-bottom: 0.5rem;
    }

    .service-column { display: flex; flex-direction: column; }

    .spoke-input-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 0;
    }

    .spoke-input-row input[type="number"] {
      width: 80px;
      height: 2.5em;
    }

    .custom-service-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 0.75rem;
    }

    .price-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .price-input-wrapper::before {
      content: '$';
      position: absolute;
      left: 1rem;
      font-weight: 600;
      color: #5b6fcc;
    }

    .price-input-wrapper input { padding-left: 2rem !important; }

    .category textarea {
      width: 100%;
      padding: 1rem;
      font-size: 1rem;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      resize: vertical;
      min-height: 100px;
    }

    .submit-wrapper {
      text-align: center;
      margin: 2rem auto;
      max-width: 900px;
    }

    .submit-wrapper button {
      font-size: 1.2rem;
      padding: 1rem 3rem;
      background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
    }

    .submit-wrapper button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(40, 167, 69, 0.5);
    }

    .submit-wrapper button:disabled {
      background: #ccc;
      cursor: not-allowed;
      box-shadow: none;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .overlay.show { display: flex; }

    .popup {
      background: white;
      padding: 2.5rem 3rem;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
      width: 420px;
      animation: slideUp 0.4s ease-out;
    }

    .popup .heading-with-checks {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .popup .checkmark, .popup .xmark {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .popup .checkmark {
      background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
      box-shadow: 0 8px 20px rgba(40,167,69,0.35);
    }
    .popup .xmark {
      background: linear-gradient(135deg, #dc3545 0%, #e63946 100%);
      box-shadow: 0 8px 20px rgba(220,53,69,0.35);
    }
    .popup .checkmark [data-lucide],
    .popup .xmark [data-lucide] {
      width: 30px;
      height: 30px;
      color: white;
      stroke-width: 2.6;
    }

    .popup h3 { font-size: 1.8rem; font-weight: 700; margin-bottom: 0.5rem; }
    .popup p { font-size: 1.05rem; color: #666; line-height: 1.6; }

    #successOverlay h3 {
      background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #errorOverlay h3 {
      background: linear-gradient(135deg, #dc3545 0%, #e63946 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #errorReason { font-size: 0.95rem; margin-top: 1rem; color: #555; }

    @media (max-width: 768px) {
      body { padding: 1rem 0.5rem; }
      .login-box { padding: 2rem 1.5rem; }
      h2 { font-size: 1.6rem; }
      .lookup-box { padding: 1.25rem; }
      .lookup-box > div:first-child { grid-template-columns: 1fr !important; }
      .update-customer-grid { grid-template-columns: 1fr !important; }
      .service-section { padding: 1.25rem; }
      .category { padding: 1rem; }
      .category label { font-size: 0.95rem; }
      .two-column-grid { grid-template-columns: 1fr; }
      .custom-service-row { grid-template-columns: 1fr; }
      .submit-wrapper button { width: 100%; font-size: 1rem; }
      .top-header { padding: 0.5rem 0.75rem; margin: -1rem -0.5rem 1rem -0.5rem; }
      .form-switcher a { padding: 0.35rem 0.6rem; font-size: 0.7rem; gap: 0.25rem; }
      .form-switcher a .icon { font-size: 0.8rem; }
      .logout-btn { padding: 0.35rem 0.7rem; font-size: 0.7rem; }
    }

    /* ── New Customer mode ───────────────────────────────────── */
    .mode-toggle-btn {
      background: #5b6fcc;
      color: white;
      border: none;
      padding: 0.55rem 1.15rem;
      border-radius: 20px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.88rem;
      font-family: 'Outfit', sans-serif;
      transition: all 0.3s ease;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(91, 111, 204, 0.35);
      white-space: nowrap;
    }
    .mode-toggle-btn:hover { background: #4d62b8; transform: translateY(-1px); }
    .mode-toggle-btn.nc-active {
      background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
      box-shadow: 0 2px 8px rgba(40, 167, 69, 0.35);
    }
    .nc-badge {
      display: none;
    }
    #newCustomerSection { display: none; }
    #newCustomerSection label { margin-bottom: 0; display: block; }
    #newCustomerSection label + label { margin-top: 0.5rem; }
    #newCustomerSection input { border-color: #28a745; background: #f0fff4; }
    #newCustomerSection input:focus {
      border-color: #20c997;
      box-shadow: 0 0 0 4px rgba(40, 167, 69, 0.1);
      background: white;
    }
    .lookup-bottom-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 1rem;
    }
    @media (max-width: 768px) {
      .lookup-bottom-row { flex-direction: column; align-items: stretch; gap: 0.5rem; }
      .lookup-bottom-row .mode-toggle-btn { text-align: center; width: 100%; }
      .nc-hint { display: none; }
    }
  </style>
</head>
<body>

<!-- Login Screen -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h2>Brooklyn Bikery</h2>
    <p>Service Entry Access</p>
    <form class="login-form" id="loginForm">
      <input type="password" id="passwordInput" placeholder="Enter password" autocomplete="current-password" required>
      <div class="error-message" id="errorMessage">Incorrect password. Please try again.</div>
      <button type="submit">Login</button>
    </form>
  </div>
</div>

<!-- Main App -->
<div class="main-app" id="mainApp">
  <!-- Top Header Bar -->
  <div class="top-header">
    <div class="form-switcher">
      <a href="backend-form.html" class="active"><span class="icon"><i data-lucide="wrench"></i></span> Service Entry</a>
      <a href="admin-dashboard.html"><span class="icon"><i data-lucide="layout-dashboard"></i></span> Dashboard</a>
    </div>
    <div class="shop-name" id="shopName" style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-weight:800; font-size:1.1rem; color:#FCD34D; letter-spacing:0.03em; white-space:nowrap; pointer-events:none; text-shadow:0 1px 2px rgba(0,0,0,0.15);"></div>
    <button class="logout-btn" onclick="logout()"><i data-lucide="log-out"></i> Logout</button>
  </div>

  <div class="overlay" id="successOverlay">
    <div class="popup">
      <div class="heading-with-checks">
        <span class="checkmark"><i data-lucide="check"></i></span>
      </div>
      <h3>Successfully Submitted!</h3>
      <p><span id="successLine">Service entry saved.</span><br><br><strong id="successShop"></strong></p>
    </div>
  </div>

  <div class="overlay" id="errorOverlay">
    <div class="popup">
      <div class="heading-with-checks">
        <span class="xmark"><i data-lucide="x"></i></span>
      </div>
      <h3>Oops! Something Went Wrong</h3>
      <div id="errorReason"></div>
    </div>
  </div>

  <div class="header-section">
    <h2>Service Entry</h2>
  </div>

  <form id="serviceForm">
    <div class="lookup-box">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1rem;">
        <label><i data-lucide="bike"></i>Bike Description:
          <input type="text" name="bikeDescription" placeholder="e.g., Blue E-Bike">
        </label>

        <!-- Right column: existing phone OR new customer fields -->
        <div>
          <div id="existingPhoneSection">
            <label><i data-lucide="phone"></i>Customer's Phone (for lookup):
              <input type="text" name="lookupPhone" id="lookupPhone" placeholder="Enter phone number">
            </label>
          </div>
          <div id="newCustomerSection">
            <label><i data-lucide="user"></i>Name:
              <input type="text" id="ncName" placeholder="Customer name" autocomplete="off">
            </label>
            <label><i data-lucide="phone"></i>Phone:
              <input type="text" id="ncPhone" placeholder="(555) 000-0000" autocomplete="off">
            </label>
            <label style="display:inline-flex; align-items:center; gap:0.45rem; font-size:0.82rem; font-weight:600; color:#555; cursor:pointer; user-select:none; margin-top:0.35rem;">
              <input type="checkbox" id="ncSmsConsent" checked style="width:16px; height:16px; accent-color:#22c55e; cursor:pointer;">
              Customer agrees to receive texts (invoices &amp; updates)
            </label>
          </div>
        </div>
      </div>

      <!-- Bottom row: existing controls + mode toggle button -->
      <div class="lookup-bottom-row">
        <div id="existingControls" style="flex: 1;">
          <div class="update-customer-section" id="updateCustomerSection">
            <div class="update-customer-header" onclick="toggleCustomerBox()">
              <div class="update-customer-title">
                <span class="icon"><i data-lucide="pencil"></i></span>
                <span>Update Customer Info</span>
              </div>
              <div class="update-customer-arrow"><i data-lucide="chevron-down"></i></div>
            </div>
            <div class="update-customer-body">
              <div class="update-customer-grid">
                <label>
                  <span><i data-lucide="user"></i>New Name</span>
                  <input type="text" name="name" placeholder="Enter new name">
                </label>
                <label>
                  <span><i data-lucide="smartphone"></i>New Phone</span>
                  <input type="text" name="phone" placeholder="Enter new phone">
                </label>
              </div>
            </div>
          </div>
        </div>

        <!-- Mode toggle (always visible) -->
        <button type="button" id="modeToggleBtn" onclick="toggleMode()" class="mode-toggle-btn"><i data-lucide="plus"></i>New Order</button>
      </div>
    </div>

    <div class="service-section">
      <!-- Service checkboxes render here from the shop's service_catalog
           (getCatalog API). Layout/classes are identical to the old static
           markup — only the SOURCE changed from hardcoded HTML to data. -->
      <div id="serviceSections">
        <div style="text-align:center; color:#888; padding:1.2rem 0;" id="catalogLoading">Loading services…</div>
      </div>

      <fieldset class="category">
        <legend><i data-lucide="file-text"></i>Notes</legend>
        <label>
          <textarea id="notes" name="notes" rows="4" placeholder="Add any notes about this service..."></textarea>
        </label>
      </fieldset>
    </div>

    <div class="submit-wrapper">
      <label style="display:inline-flex; align-items:center; gap:0.55rem; margin-bottom:1.25rem; font-size:1rem; font-weight:600; color:#fff; cursor:pointer; user-select:none; text-shadow:0 1px 2px rgba(0,0,0,0.2);">
        <input type="checkbox" id="sendInvoice" checked style="width:19px; height:19px; accent-color:#22c55e; cursor:pointer;">
        Text the customer their invoice
      </label>
      <div><button type="submit">Submit Service</button></div>
    </div>
  </form>
</div>

<script>
// ============================================
// API CONFIGURATION
// ============================================
const API_ADMIN = 'https://rqshavktfa.execute-api.us-east-1.amazonaws.com/stage/AdminDashboard';
const API_SERVICES = 'https://rysf6hggs6.execute-api.us-east-1.amazonaws.com/stage/submitservices';

// ============================================
// TOKEN MANAGEMENT
// ============================================
// Token in localStorage (shared across all tabs/pages of this origin) so Service
// Entry and the Dashboard are ALWAYS the same shop — you can't be logged into two
// shops at once. (Was sessionStorage, which kept a separate login per page and let
// this form act as a different shop than the dashboard -> wrong-shop 404s.)
function getToken() { return localStorage.getItem('bikeryToken'); }
function setToken(token) { localStorage.setItem('bikeryToken', token); }
function clearToken() { localStorage.removeItem('bikeryToken'); localStorage.removeItem('bikeryShop'); }

function isLoggedIn() {
  const token = getToken();
  if (!token) return false;
  try {
    const payload = JSON.parse(atob(token.split('.')[1]));
    return payload.exp > Math.floor(Date.now() / 1000);
  } catch { return false; }
}

// ============================================
// AUTHENTICATED FETCH
// ============================================
async function authFetch(url, options = {}) {
  const token = getToken();
  if (!token) throw new Error('Not authenticated');
  
  const headers = { ...options.headers, 'Authorization': `Bearer ${token}` };
  const response = await fetch(url, { ...options, headers });
  
  if (response.status === 401) {
    clearToken();
    showLoginScreen();
    throw new Error('Session expired');
  }
  return response;
}

// ============================================
// TENANT RESOLUTION + LOGIN BRANDING
// Which shop is this page serving? Priority:
//   1. ?tenant=<slug> URL param (explicit override / testing)
//   2. hostname {slug}.bluewrenchhq.com (per-shop domains)
//   3. null -> Brooklyn Bikery (tenant 1) on brooklynbikery.com hosts
// ============================================
function resolveTenantSlug() {
  const p = new URLSearchParams(window.location.search).get('tenant');
  if (p) return p.trim().toLowerCase();
  const m = window.location.hostname.match(/^([a-z0-9-]+)\.bluewrenchhq\.com$/);
  if (m && !['www', 'app', 'staging'].includes(m[1])) return m[1];
  return null;
}
const TENANT_SLUG = resolveTenantSlug();

// Login-screen branding: a shop's staff should see THEIR shop's name before
// logging in, not Brooklyn Bikery's. Default hosts (no slug) keep the static
// BB branding with zero network calls — behavior unchanged for BB.
(async function applyTenantBranding() {
  if (!TENANT_SLUG) return;
  const h = document.querySelector('.login-box h2');
  const cacheKey = 'bikeryBrand_' + TENANT_SLUG;
  const cached = localStorage.getItem(cacheKey);
  if (cached && h) { h.textContent = cached; document.title = cached + ' - Service Entry'; }
  try {
    const res = await fetch(API_ADMIN, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'branding', tenant: TENANT_SLUG })
    });
    const d = await res.json();
    if (res.ok && d.displayName) {
      localStorage.setItem(cacheKey, d.displayName);
      if (h) h.textContent = d.displayName;
      document.title = d.displayName + ' - Service Entry';
    }
  } catch (e) { /* keep whatever brand is showing */ }
})();

// ============================================
// LOGIN
// ============================================
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const password = document.getElementById('passwordInput').value;
  const errorMsg = document.getElementById('errorMessage');
  const submitBtn = this.querySelector('button[type="submit"]');

  // Multi-tenancy: slug from URL param or per-shop hostname. Absent ->
  // backend defaults to Brooklyn Bikery (tenant 1), unchanged.
  const tenantSlug = TENANT_SLUG;

  submitBtn.disabled = true;
  submitBtn.textContent = 'Logging in...';
  errorMsg.classList.remove('show');

  try {
    const response = await fetch(API_ADMIN, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'login', password, ...(tenantSlug ? { tenant: tenantSlug } : {}) })
    });
    
    const data = await response.json();
    
    if (response.ok && data.token) {
      setToken(data.token);
      if (data.shop) localStorage.setItem('bikeryShop', data.shop);
      showMainApp();
    } else {
      errorMsg.textContent = data.error || 'Invalid password. Please try again.';
      errorMsg.classList.add('show');
      document.getElementById('passwordInput').value = '';
      document.getElementById('passwordInput').focus();
    }
  } catch (error) {
    errorMsg.textContent = 'Connection error. Please try again.';
    errorMsg.classList.add('show');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Login';
  }
});

// ============================================
// SCREEN MANAGEMENT
// ============================================
function showLoginScreen() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('mainApp').classList.remove('active');
}

function showMainApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').classList.add('active');
  const _shopEl = document.getElementById('shopName');
  if (_shopEl) _shopEl.textContent = localStorage.getItem('bikeryShop') || '';
  setMode(true);
  // Render this shop's service menu BEFORE applying any deep-link params —
  // the checkboxes/spoke inputs the params target don't exist until then.
  ensureCatalog().then(loadLatestPhone);
}

// ============================================
// SERVICE CATALOG (data-driven service menu)
// The form renders whatever services THIS shop offers, priced from the
// shop's service_catalog — no hardcoded menu. Layout mirrors the classic
// Brooklyn Bikery form: known categories keep their section titles/icons
// and front/rear split; unknown categories get a generic section.
// ============================================
let catalogLoaded = false;

const SECTION_DEFS = [
  { title: 'Flats & Cables', icon: 'cable',  cats: ['flats', 'cables'],            twoCol: true  },
  { title: 'Brake Services', icon: 'disc',   cats: ['brakes'],                     twoCol: true  },
  { title: 'Drivetrain',     icon: 'cog',    cats: ['drivetrain', 'service'],      twoCol: false },
  { title: 'Wheels & Spokes',icon: 'disc-3', cats: ['wheels'],                     twoCol: true  },
  { title: 'Other Services', icon: 'wrench', cats: ['headset', 'ebike', 'assembly'], twoCol: false },
];

function svcSide(code) {
  // front_x / rear_x prefixes AND x_front_y / x_rear_y infixes both count.
  if (/^front_|_front_/.test(code)) return 'front';
  if (/^rear_|_rear_/.test(code)) return 'rear';
  return null;
}

function fmtPrice(p) { return (p % 1 === 0) ? `$${p}` : `$${p.toFixed(2)}`; }

function colLabel(svc) {
  // In a FRONT/REAR column the side word is redundant — strip it like the
  // classic form did ("Front Flat" -> "Flat" under the FRONT header).
  return svc.name.replace(/(^|\s)(Front|Rear)\s/, '$1').replace(/^\s+/, '');
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderCatalog(services) {
  const host = document.getElementById('serviceSections');
  const fixed  = services.filter(s => s.formula === 'fixed');
  const spokes = services.filter(s => s.formula === 'spoke');
  const custom = services.filter(s => s.formula === 'custom');

  const claimed = new Set();
  const sections = [];
  for (const def of SECTION_DEFS) {
    const rows = fixed.filter(s => def.cats.includes(s.category));
    const spokeRows = spokes.filter(s => def.cats.includes(s.category));
    rows.forEach(s => claimed.add(s.code));
    spokeRows.forEach(s => claimed.add(s.code));
    if (rows.length || spokeRows.length) sections.push({ ...def, rows, spokeRows });
  }
  // Any category we don't have a named section for gets a generic one.
  const leftoverCats = [...new Set(fixed.concat(spokes).filter(s => !claimed.has(s.code)).map(s => s.category))];
  for (const cat of leftoverCats) {
    const rows = fixed.filter(s => s.category === cat && !claimed.has(s.code));
    const spokeRows = spokes.filter(s => s.category === cat && !claimed.has(s.code));
    const anySided = rows.some(s => svcSide(s.code));
    sections.push({ title: cat.charAt(0).toUpperCase() + cat.slice(1), icon: 'wrench', twoCol: anySided, rows, spokeRows });
  }

  const cbox = s => `<label><input type="checkbox" data-code="${esc(s.code)}"> ${esc(colLabel(s))} (${fmtPrice(s.price)})</label>`;
  const cboxFull = s => `<label><input type="checkbox" data-code="${esc(s.code)}"> ${esc(s.name)} (${fmtPrice(s.price)})</label>`;
  const spokeRow = s => {
    const field = s.code === 'front_fix_spoke' ? 'frontSpokes' : (s.code === 'rear_fix_spoke' ? 'rearSpokes' : `qty_${s.code}`);
    return `<div class="spoke-input-row"><input type="number" name="${esc(field)}" min="0" placeholder="0"><span>Fix Spokes ($35 first, $2 each additional)</span></div>`;
  };

  let html = '';
  for (const sec of sections) {
    html += `<fieldset class="category"><legend><i data-lucide="${esc(sec.icon)}"></i>${esc(sec.title)}</legend>`;
    if (sec.twoCol) {
      const front = sec.rows.filter(s => svcSide(s.code) === 'front');
      const rear  = sec.rows.filter(s => svcSide(s.code) === 'rear');
      const mid   = sec.rows.filter(s => !svcSide(s.code));
      const fSpoke = sec.spokeRows.filter(s => svcSide(s.code) === 'front');
      const rSpoke = sec.spokeRows.filter(s => svcSide(s.code) === 'rear');
      html += `<div class="two-column-grid">
        <div class="service-column"><div class="column-header">FRONT</div>${front.map(cbox).join('')}${fSpoke.map(spokeRow).join('')}</div>
        <div class="service-column"><div class="column-header">REAR</div>${rear.map(cbox).join('')}${rSpoke.map(spokeRow).join('')}</div>
      </div>`;
      html += mid.map(cboxFull).join('');
    } else {
      html += sec.rows.map(cboxFull).join('');
      html += sec.spokeRows.map(spokeRow).join('');
    }
    html += `</fieldset>`;
  }

  if (custom.length) {
    html += `<fieldset class="category"><legend><i data-lucide="sparkles"></i>Custom Service</legend>
      <div class="custom-service-row">
        <input type="text" name="customDescription" placeholder="Description (e.g., Replace pedals)">
        <div class="price-input-wrapper">
          <input type="number" name="customPrice" min="0" step="0.01" placeholder="0.00">
        </div>
      </div></fieldset>`;
  }

  host.innerHTML = html || '<div style="text-align:center; color:#888; padding:1.2rem 0;">No services configured yet. Add services in the Dashboard.</div>';
  if (window.lucide) lucide.createIcons();
}

async function ensureCatalog() {
  if (catalogLoaded) return;
  try {
    const res = await authFetch(API_SERVICES, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'getCatalog' })
    });
    const data = await res.json();
    if (res.ok && Array.isArray(data.services)) {
      renderCatalog(data.services);
      catalogLoaded = true;
    } else {
      throw new Error(data.message || 'Bad catalog response');
    }
  } catch (e) {
    console.error('Catalog load failed:', e);
    const host = document.getElementById('serviceSections');
    host.innerHTML = '<div style="text-align:center; color:#c33; padding:1.2rem 0; cursor:pointer;" onclick="catalogLoaded=false; this.textContent=\'Loading services…\'; ensureCatalog();">Failed to load services — tap to retry</div>';
  }
}

function logout() {
  clearToken();
  showLoginScreen();
  document.getElementById('serviceForm').reset();
}

// ============================================
// MAIN APP
// ============================================
async function loadLatestPhone() {
  const urlParams = new URLSearchParams(window.location.search);

  // Capture the explicit order id (admin "Edit Services" deep-link). Sent on
  // submit so the backend edits exactly THIS order — never "the latest order
  // for whatever phone is in the box". This is the real wrong-order-bug fix.
  editOrderId = urlParams.get('orderId') || null;

  // If URL has a phone param (e.g. coming from admin dashboard's "Edit
  // Services" button), switch to Edit Existing mode for that specific
  // customer. IMPORTANT: set the lookupPhone BEFORE calling setMode —
  // setMode's "edit existing" branch kicks off reloadLatestPhone() which
  // would otherwise clobber our URL phone with whoever the most recent
  // customer in the DB happens to be (was causing edits to land on the
  // wrong customer's most recent order).
  if (urlParams.get('phone')) {
    document.getElementById('lookupPhone').value = urlParams.get('phone');
    setMode(false);
  }
  if (urlParams.get('name')) {
    document.querySelector('input[name="name"]').value = urlParams.get('name');
    document.getElementById('updateCustomerSection').classList.add('expanded');
  }
  if (urlParams.get('bike')) document.querySelector('input[name="bikeDescription"]').value = urlParams.get('bike');
  if (urlParams.get('notes')) document.getElementById('notes').value = urlParams.get('notes');
  // Spoke/custom inputs are rendered from the catalog and may not exist for
  // every shop — guard each deep-link param application.
  const _fs = document.querySelector('input[name="frontSpokes"]');
  const _rs = document.querySelector('input[name="rearSpokes"]');
  const _cd = document.querySelector('input[name="customDescription"]');
  const _cp = document.querySelector('input[name="customPrice"]');
  if (urlParams.get('frontSpokes') && _fs) _fs.value = urlParams.get('frontSpokes');
  if (urlParams.get('rearSpokes') && _rs) _rs.value = urlParams.get('rearSpokes');
  if (urlParams.get('customDesc') && _cd) _cd.value = urlParams.get('customDesc');
  if (urlParams.get('customPrice') && _cp) _cp.value = urlParams.get('customPrice');

  // Pre-check services from the dashboard deep-link. New dashboard sends
  // catalog codes via ?svc=; ?service= (legacy label form) is ignored by
  // design — admin pages are no-cache so both sides update together.
  urlParams.getAll('svc').forEach(code => {
    const cb = document.querySelector(`input[data-code="${CSS.escape(code)}"]`);
    if (cb) cb.checked = true;
  });
}

// ============================================
// NEW CUSTOMER MODE — defaults to New Order (creating a new customer);
// click the toggle to switch to Edit mode (looking up an existing customer).
// ============================================
let isNewCustomerMode = true;
// Set from the ?orderId= URL param (admin "Edit Services"). When present, the
// submit payload carries it so the backend edits exactly this order.
let editOrderId = null;

function toggleMode() {
  // User explicitly switched modes — drop any "edit this specific order" intent
  // from the deep-link so a manual lookup uses the normal latest-order flow.
  editOrderId = null;
  setMode(!isNewCustomerMode);
}

function setMode(newCustomer) {
  isNewCustomerMode = newCustomer;
  document.getElementById('existingPhoneSection').style.display = newCustomer ? 'none' : 'block';
  document.getElementById('newCustomerSection').style.display = newCustomer ? 'block' : 'none';
  document.getElementById('existingControls').style.display = newCustomer ? 'none' : 'block';
  const btn = document.getElementById('modeToggleBtn');
  if (newCustomer) {
    btn.innerHTML = '<i data-lucide="pencil"></i>Edit Existing';
    document.getElementById('ncName').value = '';
    document.getElementById('ncPhone').value = '';
  } else {
    btn.innerHTML = '<i data-lucide="plus"></i>New Order';
    // Only auto-populate with the latest customer's phone if the field is
    // empty. If the URL already set a specific phone (Edit Services flow),
    // we must not clobber it.
    if (!document.getElementById('lookupPhone').value.trim()) {
      reloadLatestPhone();
    }
  }
  if (window.lucide) lucide.createIcons();
}

async function reloadLatestPhone() {
  // WRONG-ORDER GUARD. reloadLatestPhone fills the field with the *latest*
  // customer's phone for convenience on a fresh manual lookup. But it is async,
  // so it could resolve AFTER an "Edit Services" deep-link has already filled the
  // field/orderId — overwriting the intended customer with the newest one (the
  // resurfaced wrong-order bug: form showed +1500555000X for the wrong rider).
  // Never touch the field when we're editing a specific order, and re-check both
  // BEFORE and AFTER the await so a slow fetch can't clobber a deep-link.
  const isDeepLink = () => {
    const q = new URLSearchParams(window.location.search);
    return !!(editOrderId || q.get('phone') || q.get('orderId'));
  };
  if (isDeepLink() || document.getElementById('lookupPhone').value.trim()) return;
  try {
    const res = await authFetch(API_SERVICES);
    const result = await res.json();
    if (!isDeepLink() && !document.getElementById('lookupPhone').value.trim() && result.phone) {
      document.getElementById('lookupPhone').value = result.phone;
    }
  } catch (e) { console.error('Failed to reload phone:', e); }
}

function toggleCustomerBox() {
  const section = document.getElementById('updateCustomerSection');
  section.classList.toggle('expanded');
}

const successOverlay = document.getElementById('successOverlay');
const errorOverlay = document.getElementById('errorOverlay');
const errorReason = document.getElementById('errorReason');

successOverlay.addEventListener('click', () => successOverlay.classList.remove('show'));
errorOverlay.addEventListener('click', () => errorOverlay.classList.remove('show'));

document.getElementById('serviceForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const submitBtn = e.target.querySelector('button[type="submit"]');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Submitting...';

  // Validate required fields
  if (isNewCustomerMode) {
    const ncName = document.getElementById('ncName').value.trim();
    const ncPhone = document.getElementById('ncPhone').value.trim();
    if (!ncName || !ncPhone) {
      showError('Please enter the customer name and phone number.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit Service';
      return;
    }
  } else if (!document.querySelector('input[name="lookupPhone"]').value.trim()) {
    showError('Please enter a phone number to look up the customer.');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Submit Service';
    return;
  }

  const formData = {
    name: isNewCustomerMode ? document.getElementById('ncName').value.trim() : document.querySelector('input[name="name"]').value,
    phone: isNewCustomerMode ? document.getElementById('ncPhone').value.trim() : document.querySelector('input[name="phone"]').value,
    lookupPhone: isNewCustomerMode ? '' : document.querySelector('input[name="lookupPhone"]').value,
    orderId: isNewCustomerMode ? null : editOrderId,
    isNewCustomer: isNewCustomerMode,
    smsConsent: isNewCustomerMode ? (document.getElementById('ncSmsConsent')?.checked ?? true) : undefined,
    sendInvoice: document.getElementById('sendInvoice')?.checked ?? true,
    bikeDescription: document.querySelector('input[name="bikeDescription"]').value.trim(),
    serviceCodes: [],
    frontSpokes: 0,
    rearSpokes: 0,
    notes: document.getElementById("notes").value.trim(),
    customDescription: '',
    customPrice: 0
  };

  // Catalog-driven: checkboxes carry the catalog `code`; the backend prices
  // each code from the shop's service_catalog (never from the client).
  document.querySelectorAll('.category input[type="checkbox"][data-code]').forEach(cb => {
    if (cb.checked) formData.serviceCodes.push(cb.getAttribute('data-code'));
  });

  const frontSpokesInput = document.querySelector('input[name="frontSpokes"]');
  if (frontSpokesInput?.value && parseInt(frontSpokesInput.value) > 0) {
    formData.frontSpokes = parseInt(frontSpokesInput.value);
  }

  const rearSpokesInput = document.querySelector('input[name="rearSpokes"]');
  if (rearSpokesInput?.value && parseInt(rearSpokesInput.value) > 0) {
    formData.rearSpokes = parseInt(rearSpokesInput.value);
  }

  // Custom-service inputs only exist if this shop's catalog has a custom row.
  const customDescInput = document.querySelector('input[name="customDescription"]');
  const customPriceInput = document.querySelector('input[name="customPrice"]');
  const customDesc = customDescInput ? customDescInput.value.trim() : '';
  const customPrice = customPriceInput ? (parseFloat(customPriceInput.value) || 0) : 0;
  if (customDesc && customPrice > 0) {
    formData.customDescription = customDesc;
    formData.customPrice = customPrice;
  }

  try {
    const res = await authFetch(API_SERVICES, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(formData)
    });

    const result = await res.json().catch(() => ({}));
    if (res.ok && result.message === "Success") {
      // Conditional success copy: the backend reports whether it actually queued
      // the invoice text (`sms: "queued"`) or intentionally skipped it
      // (`sms: "skipped"`, i.e. the "Text the customer" box was unchecked). Only
      // claim the customer was notified when a text really went out. The shop name
      // is taken from the logged-in tenant (textContent = no HTML injection),
      // replacing the old hardcoded "Brooklyn Bikery".
      const _line = document.getElementById('successLine');
      const _shop = document.getElementById('successShop');
      if (_line) _line.textContent =
        result.sms === 'queued' ? 'Service entry saved — the customer was texted their invoice.'
        : result.sms === 'optout' ? 'Service entry saved. This customer has opted out of texts (replied STOP), so no invoice was sent.'
        : 'Service entry saved. The customer was not texted.';
      if (_shop) _shop.textContent = (localStorage.getItem('bikeryShop') || '').trim();
      successOverlay.classList.add('show');
      e.target.reset();
      setTimeout(() => successOverlay.classList.remove('show'), 4000);

      if (isNewCustomerMode) {
        setMode(false); // exit new customer mode and reload latest phone
      } else {
        // WRONG-ORDER FIX: after editing a SPECIFIC order, return to a clean
        // New Order slate. The old code fetched the *latest* customer's phone
        // and left the just-edited order's editOrderId in place — so the form
        // appeared to switch to a different customer ("editing the wrong
        // order"), and a re-submit could target the wrong order. Clear the edit
        // context so the next action starts fresh.
        editOrderId = null;
        setMode(true);
      }
    } else {
      showError(result.message || result.error || "Unknown error.");
    }
  } catch (err) {
    if (err.message === 'Session expired') showError("Session expired. Please log in again.");
    else showError("An unexpected error occurred.");
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Submit Service';
  }

  function showError(msg) {
    successOverlay.classList.remove('show');
    errorReason.innerText = msg;
    errorOverlay.classList.add('show');
  }
});

// ============================================
// INITIALIZE — must be at the END of the script so all `let` declarations
// (e.g. isNewCustomerMode) are initialized before showMainApp/setMode run.
// ============================================
(function() {
  if (isLoggedIn()) showMainApp();
  else showLoginScreen();
  if (window.lucide) lucide.createIcons();
})();
</script>
</body>
</html>
