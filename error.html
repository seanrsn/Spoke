<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - Brooklyn Bikery</title>
  
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon.png">
  
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      position: relative;
      overflow: hidden;
    }
    
    body::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
      border-radius: 50%;
    }
    
    body::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -10%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
      border-radius: 50%;
    }
    
    .error-container {
      text-align: center;
      padding: 2rem;
      max-width: 600px;
      position: relative;
      z-index: 1;
    }
    
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }
    
    .logo img {
      height: 60px;
      width: auto;
    }
    
    .logo-text {
      font-size: 1.6rem;
      font-weight: 800;
      color: white;
    }
    
    .error-code {
      font-size: 8rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 1rem;
      text-shadow: 0 4px 30px rgba(0,0,0,0.3);
    }
    
    .bike-icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      animation: wobble 2s ease-in-out infinite;
    }
    
    @keyframes wobble {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-5deg); }
      75% { transform: rotate(5deg); }
    }
    
    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 1rem;
      text-shadow: 0 2px 20px rgba(0,0,0,0.2);
    }
    
    p {
      font-size: 1.2rem;
      color: rgba(255,255,255,0.9);
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }
    
    .buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .btn {
      padding: 1rem 2rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .btn-primary {
      background: white;
      color: #667eea;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    
    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }
    
    .btn-secondary {
      background: rgba(255,255,255,0.2);
      color: white;
      border: 2px solid rgba(255,255,255,0.5);
    }
    
    .btn-secondary:hover {
      background: rgba(255,255,255,0.3);
      transform: translateY(-3px);
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .error-code {
        font-size: 5rem;
      }
      
      .bike-icon {
        font-size: 3rem;
      }
      
      h1 {
        font-size: 1.8rem;
      }
      
      p {
        font-size: 1rem;
      }
      
      .logo img {
        height: 45px;
      }
      
      .logo-text {
        font-size: 1.3rem;
      }
      
      body::before {
        width: 300px;
        height: 300px;
        top: -30%;
        right: -30%;
      }
      
      body::after {
        width: 200px;
        height: 200px;
      }
    }
  </style>
</head>
<body>
  <div class="error-container">
    <a href="/" class="logo">
      <img src="/brooklyn-bikery-logo.png" alt="Brooklyn Bikery">
      <span class="logo-text">Brooklyn Bikery</span>
    </a>
    
    <div class="error-code">404</div>
    <div class="bike-icon">🚲</div>
    
    <h1>Looks Like You've Hit a Pothole!</h1>
    <p>This page doesn't exist. Maybe you took a wrong turn at Coney Island?</p>
    
    <div class="buttons">
      <a href="/" class="btn btn-primary">🏠 Back to Home</a>
      <a href="tel:17182184464" class="btn btn-secondary">📞 Call Us</a>
    </div>
  </div>
</body>
</html>
