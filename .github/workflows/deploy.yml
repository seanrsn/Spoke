name: Deploy to AWS

on:
  push:
    branches:
      - main
      - 'claude/**'
      - staging
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

# Serialize the whole pipeline: overlapping runs would fight over the staging
# stack that the prod gate deploys to, making gate results meaningless.
concurrency:
  group: deploy-pipeline
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  S3_BUCKET: brooklynbikery.com
  CLOUDFRONT_ID: E3A6Y3SPOMYKVP

jobs:
  prepare:
    name: Merge claude.ai changes into main (if needed)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
      target: ${{ steps.decide.outputs.target }}
      ref: ${{ steps.decide.outputs.ref }}
    steps:
      - name: Decide what to do
        id: decide
        run: |
          # should_deploy must be set ONLY when we actually want to deploy.
          # target = prod|staging selects which stack the deploy jobs hit.
          # ref    = which git ref the deploy jobs check out and ship.
          # A push to the `staging` branch deploys the -staging stack and is
          # NEVER auto-merged into main (staging is a deliberate first stop).
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "mode=staging_deploy" >> $GITHUB_OUTPUT
            echo "should_deploy=true"  >> $GITHUB_OUTPUT
            echo "target=staging"      >> $GITHUB_OUTPUT
            echo "ref=staging"         >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "pull_request" && "${{ startsWith(github.head_ref, 'claude/') }}" == "true" ]]; then
            echo "mode=merge_pr"      >> $GITHUB_OUTPUT
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "target=prod"        >> $GITHUB_OUTPUT
            echo "ref=main"           >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "push" && "${{ startsWith(github.ref, 'refs/heads/claude/') }}" == "true" ]]; then
            echo "mode=merge_branch"  >> $GITHUB_OUTPUT
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "target=prod"        >> $GITHUB_OUTPUT
            echo "ref=main"           >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "mode=passthrough"   >> $GITHUB_OUTPUT
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "target=prod"        >> $GITHUB_OUTPUT
            echo "ref=main"           >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=passthrough"   >> $GITHUB_OUTPUT
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "target=prod"        >> $GITHUB_OUTPUT
            echo "ref=main"           >> $GITHUB_OUTPUT
          else
            echo "mode=skip"           >> $GITHUB_OUTPUT
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "target=prod"         >> $GITHUB_OUTPUT
            echo "ref=main"            >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.decide.outputs.mode == 'merge_branch'
        with:
          fetch-depth: 0

      - name: Merge claude branch into main
        if: steps.decide.outputs.mode == 'merge_branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge --no-ff "origin/${{ github.ref_name }}" -m "Auto-merge ${{ github.ref_name }}"
          git push origin main
          git push origin --delete "${{ github.ref_name }}" || true

      - name: Merge PR into main
        if: steps.decide.outputs.mode == 'merge_pr'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash --delete-branch ${{ github.event.pull_request.number }} --repo ${{ github.repository }}

  prod-gate:
    name: "Prod gate: deploy to staging + run integration tests"
    needs: [prepare]
    # Every PROD-target deploy must first prove itself on the staging stack.
    # This ships the exact code that is about to hit prod to the -staging
    # Lambdas + staging site, then runs the integration suite against it.
    # If anything fails, the prod deploy jobs below never run.
    if: needs.prepare.outputs.should_deploy == 'true' && needs.prepare.outputs.target == 'prod'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Deploy Lambdas to the -staging stack
        run: |
          set -e
          declare -A FUNCTIONS=(
            ["Admin-Dashboard.py"]="AdminDashboard:1"
            ["Backend-Form.py"]="SubmitBackendForm:1"
            ["Customer-Form.py"]="SubmitCustomerForm:1"
            ["Send-SMS.py"]="SendSMS:1"
          )
          for SRC in "${!FUNCTIONS[@]}"; do
            IFS=':' read -r FN_NAME NEEDS_PYMYSQL <<< "${FUNCTIONS[$SRC]}"
            TARGET_FN="${FN_NAME}-staging"
            echo "Packaging $SRC -> $TARGET_FN"
            BUILD_DIR=$(mktemp -d)
            cp "$SRC" "$BUILD_DIR/lambda_function.py"
            if [ "$NEEDS_PYMYSQL" = "1" ]; then
              pip install pymysql==1.1.1 -t "$BUILD_DIR" --quiet
            fi
            ZIP="/tmp/${TARGET_FN}.zip"
            (cd "$BUILD_DIR" && zip -rq "$ZIP" . -x "*.pyc" "__pycache__/*" "*.dist-info/*")
            aws lambda update-function-code \
              --function-name "$TARGET_FN" \
              --zip-file "fileb://$ZIP" \
              --region "$AWS_REGION" \
              --output text --query 'LastUpdateStatus'
            # update-function-code is async; wait so tests hit the new code.
            aws lambda wait function-updated --function-name "$TARGET_FN" --region "$AWS_REGION"
            rm -rf "$BUILD_DIR" "$ZIP"
          done

      - name: Set up Node (for Tailwind build)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build Tailwind CSS
        run: |
          npm ci --silent
          npm run build:css

      - name: Sync frontend to staging bucket (with API rewrite)
        run: |
          for f in *.html *.css *.js *.json; do
            [ -f "$f" ] || continue
            case "$f" in
              customer-form.html) continue ;;
              neonindex.html)     continue ;;
            esac
            case "$f" in
              admin-dashboard.html|backend-form.html)
                CACHE="no-cache, must-revalidate" ;;
              *)
                CACHE="public, max-age=300, must-revalidate" ;;
            esac
            TMP="$(mktemp)"
            sed -e 's/rqshavktfa/dm63xxwajj/g' \
                -e 's/rysf6hggs6/dvo3bho9mj/g' \
                -e 's/pp7s8cgqke/0nevdp3exi/g' "$f" > "$TMP"
            CT="$(case "$f" in *.html) echo text/html;; *.css) echo text/css;; *.js) echo application/javascript;; *.json) echo application/json;; *) echo application/octet-stream;; esac)"
            aws s3 cp "$TMP" "s3://bikery-staging-site/$f" \
              --content-type "$CT" --cache-control "$CACHE" --region "$AWS_REGION"
            rm -f "$TMP"
          done
          aws cloudfront create-invalidation --distribution-id E28UATBUDSN4QU \
            --paths "/*" --query 'Invalidation.Id' --output text

      - name: Install test deps
        run: pip install boto3 pymysql==1.1.1 --quiet

      - name: Run integration tests against staging
        run: python tests/staging_integration.py

  deploy-lambdas:
    name: Deploy Lambda functions
    needs: [prepare, prod-gate]
    # Runs when: staging target (gate skipped) OR prod target with gate green.
    if: >-
      !failure() && !cancelled() &&
      needs.prepare.outputs.should_deploy == 'true' &&
      (needs.prod-gate.result == 'success' || needs.prod-gate.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package and deploy each Lambda
        env:
          TARGET: ${{ needs.prepare.outputs.target }}
        run: |
          set -e

          # Staging deploys to the same functions suffixed with -staging.
          # Their env vars (DB_SECRET_ID, STAGE, etc.) were set at create time
          # and are preserved across update-function-code, so code-only updates
          # keep staging pointed at the staging stack.
          SUFFIX=""
          if [ "$TARGET" = "staging" ]; then SUFFIX="-staging"; fi
          echo "Deploy target: ${TARGET:-prod} (function suffix='${SUFFIX}')"

          declare -A FUNCTIONS=(
            ["Admin-Dashboard.py"]="AdminDashboard:1"
            ["Backend-Form.py"]="SubmitBackendForm:1"
            ["Customer-Form.py"]="SubmitCustomerForm:1"
            ["Send-SMS.py"]="SendSMS:1"
          )

          for SRC in "${!FUNCTIONS[@]}"; do
            IFS=':' read -r FN_NAME NEEDS_PYMYSQL <<< "${FUNCTIONS[$SRC]}"
            TARGET_FN="${FN_NAME}${SUFFIX}"
            echo ""
            echo "📦 Packaging $SRC -> $TARGET_FN"

            BUILD_DIR=$(mktemp -d)
            cp "$SRC" "$BUILD_DIR/lambda_function.py"

            if [ "$NEEDS_PYMYSQL" = "1" ]; then
              pip install pymysql==1.1.1 -t "$BUILD_DIR" --quiet
            fi

            ZIP="/tmp/${TARGET_FN}.zip"
            (cd "$BUILD_DIR" && zip -rq "$ZIP" . -x "*.pyc" "__pycache__/*" "*.dist-info/*")

            echo "   Deploying to $TARGET_FN ($(du -h "$ZIP" | cut -f1))"
            aws lambda update-function-code \
              --function-name "$TARGET_FN" \
              --zip-file "fileb://$ZIP" \
              --region "$AWS_REGION" \
              --output text \
              --query 'LastUpdateStatus'

            rm -rf "$BUILD_DIR" "$ZIP"
          done

  deploy-frontend:
    name: Sync frontend to S3 + invalidate CloudFront
    needs: [prepare, prod-gate]
    # Same gating as deploy-lambdas: staging passes straight through, prod
    # requires the gate to have finished green.
    if: >-
      !failure() && !cancelled() &&
      needs.prepare.outputs.should_deploy == 'true' &&
      (needs.prod-gate.result == 'success' || needs.prod-gate.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve deploy target (prod vs staging)
        env:
          TARGET: ${{ needs.prepare.outputs.target }}
        run: |
          # Staging ships to its own bucket + CloudFront and rewrites the prod
          # API Gateway IDs to the staging ones so the staging site calls the
          # staging APIs. Prod uses the workflow-level env defaults unchanged.
          if [ "$TARGET" = "staging" ]; then
            echo "DEPLOY_BUCKET=bikery-staging-site"  >> $GITHUB_ENV
            echo "DEPLOY_CF_ID=E28UATBUDSN4QU"        >> $GITHUB_ENV
            echo "REWRITE_API=1"                      >> $GITHUB_ENV
          else
            echo "DEPLOY_BUCKET=${S3_BUCKET}"         >> $GITHUB_ENV
            echo "DEPLOY_CF_ID=${CLOUDFRONT_ID}"      >> $GITHUB_ENV
            echo "REWRITE_API=0"                      >> $GITHUB_ENV
          fi

      - name: Set up Node (for Tailwind build)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build Tailwind CSS
        run: |
          npm ci --silent
          npm run build:css

      - name: Sync HTML/CSS/JS/JSON to S3
        run: |
          # customer-form.html is retired (staff-internal flow now). Don't ship.
          for f in *.html *.css *.js *.json; do
            [ -f "$f" ] || continue
            case "$f" in
              customer-form.html) echo "Skipping retired $f"; continue ;;
              neonindex.html)     echo "Skipping legacy $f";  continue ;;
            esac
            # Admin tools must NEVER run stale JS. A cached old build of the admin
            # form is a suspected vector for the wrong-order bug that corrupted a
            # real customer's order: the browser kept running pre-fix code for up
            # to 5 min after a deploy. Force revalidation on every load for the two
            # admin pages so a shipped fix can't be silently bypassed by the cache.
            # Public marketing pages keep the 5-min CDN cache (perf, no risk).
            case "$f" in
              admin-dashboard.html|backend-form.html)
                CACHE="no-cache, must-revalidate" ;;
              *)
                CACHE="public, max-age=300, must-revalidate" ;;
            esac
            if [ "$REWRITE_API" = "1" ]; then
              # Staging: rewrite prod API Gateway IDs -> staging IDs into a temp
              # file. The temp has no extension, so set content-type explicitly.
              TMP="$(mktemp)"
              sed -e 's/rqshavktfa/dm63xxwajj/g' \
                  -e 's/rysf6hggs6/dvo3bho9mj/g' \
                  -e 's/pp7s8cgqke/0nevdp3exi/g' "$f" > "$TMP"
              CT="$(case "$f" in *.html) echo text/html;; *.css) echo text/css;; *.js) echo application/javascript;; *.json) echo application/json;; *) echo application/octet-stream;; esac)"
              aws s3 cp "$TMP" "s3://${DEPLOY_BUCKET}/$f" \
                --content-type "$CT" --cache-control "$CACHE" --region "$AWS_REGION"
              rm -f "$TMP"
            else
              # Prod: ship the file as-is (aws s3 cp auto-detects content-type) —
              # byte-identical to the original behavior.
              aws s3 cp "$f" "s3://${DEPLOY_BUCKET}/$f" \
                --cache-control "$CACHE" --region "$AWS_REGION"
            fi
          done

      - name: Sync sitemap + robots + brand assets
        run: |
          for f in sitemap.xml robots.txt; do
            [ -f "$f" ] && aws s3 cp "$f" "s3://${DEPLOY_BUCKET}/$f" \
              --cache-control "public, max-age=3600" \
              --region "$AWS_REGION"
          done
          # Brand images referenced by the BlueWrench marketing pages (the
          # html/css/js glob above doesn't cover images).
          [ -f bluewrench-logo.png ] && aws s3 cp bluewrench-logo.png \
            "s3://${DEPLOY_BUCKET}/bluewrench-logo.png" \
            --cache-control "public, max-age=86400" --region "$AWS_REGION" || true

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DEPLOY_CF_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text

  staging-tests:
    name: Run staging integration tests (staging only)
    needs: [prepare, deploy-lambdas, deploy-frontend]
    # Only after a STAGING deploy. Never runs for prod. A failure here is your
    # signal NOT to promote the change to main. The centerpiece is the
    # wrong-order regression test that guards the order-corruption bug class.
    if: needs.prepare.outputs.target == 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test deps
        run: pip install boto3 pymysql==1.1.1 --quiet

      - name: Run staging integration tests
        run: python tests/staging_integration.py
