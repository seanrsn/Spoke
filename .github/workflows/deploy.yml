name: Deploy to AWS

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  S3_BUCKET: brooklynbikery.com
  CLOUDFRONT_ID: E3A6Y3SPOMYKVP

jobs:
  prepare:
    name: Merge claude.ai changes into main (if needed)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - name: Decide what to do
        id: decide
        run: |
          # should_deploy must be set ONLY when we actually want to deploy.
          # Previously emitted unconditionally — meant any PR open/sync from a
          # non-claude branch would still trigger Lambda + S3 redeploy of main.
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ startsWith(github.head_ref, 'claude/') }}" == "true" ]]; then
            echo "mode=merge_pr"      >> $GITHUB_OUTPUT
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "push" && "${{ startsWith(github.ref, 'refs/heads/claude/') }}" == "true" ]]; then
            echo "mode=merge_branch"  >> $GITHUB_OUTPUT
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "mode=passthrough"   >> $GITHUB_OUTPUT
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=passthrough"   >> $GITHUB_OUTPUT
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "mode=skip"           >> $GITHUB_OUTPUT
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.decide.outputs.mode == 'merge_branch'
        with:
          fetch-depth: 0

      - name: Merge claude branch into main
        if: steps.decide.outputs.mode == 'merge_branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge --no-ff "origin/${{ github.ref_name }}" -m "Auto-merge ${{ github.ref_name }}"
          git push origin main
          git push origin --delete "${{ github.ref_name }}" || true

      - name: Merge PR into main
        if: steps.decide.outputs.mode == 'merge_pr'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash --delete-branch ${{ github.event.pull_request.number }} --repo ${{ github.repository }}

  deploy-lambdas:
    name: Deploy Lambda functions
    needs: [prepare]
    if: needs.prepare.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package and deploy each Lambda
        run: |
          set -e

          declare -A FUNCTIONS=(
            ["Admin-Dashboard.py"]="AdminDashboard:1"
            ["Backend-Form.py"]="SubmitBackendForm:1"
            ["Customer-Form.py"]="SubmitCustomerForm:1"
            ["Send-SMS.py"]="SendSMS:0"
          )

          for SRC in "${!FUNCTIONS[@]}"; do
            IFS=':' read -r FN_NAME NEEDS_PYMYSQL <<< "${FUNCTIONS[$SRC]}"
            echo ""
            echo "📦 Packaging $SRC -> $FN_NAME"

            BUILD_DIR=$(mktemp -d)
            cp "$SRC" "$BUILD_DIR/lambda_function.py"

            if [ "$NEEDS_PYMYSQL" = "1" ]; then
              pip install pymysql==1.1.1 -t "$BUILD_DIR" --quiet
            fi

            ZIP="/tmp/${FN_NAME}.zip"
            (cd "$BUILD_DIR" && zip -rq "$ZIP" . -x "*.pyc" "__pycache__/*" "*.dist-info/*")

            echo "   Deploying to $FN_NAME ($(du -h "$ZIP" | cut -f1))"
            aws lambda update-function-code \
              --function-name "$FN_NAME" \
              --zip-file "fileb://$ZIP" \
              --region "$AWS_REGION" \
              --output text \
              --query 'LastUpdateStatus'

            rm -rf "$BUILD_DIR" "$ZIP"
          done

  deploy-frontend:
    name: Sync frontend to S3 + invalidate CloudFront
    needs: [prepare]
    if: needs.prepare.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Node (for Tailwind build)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build Tailwind CSS
        run: |
          npm ci --silent
          npm run build:css

      - name: Sync HTML/CSS/JS/JSON to S3
        run: |
          # customer-form.html is retired (staff-internal flow now). Don't ship.
          for f in *.html *.css *.js *.json; do
            [ -f "$f" ] || continue
            case "$f" in
              customer-form.html) echo "Skipping retired $f"; continue ;;
              neonindex.html)     echo "Skipping legacy $f";  continue ;;
            esac
            CACHE="public, max-age=300, must-revalidate"
            aws s3 cp "$f" "s3://${S3_BUCKET}/$f" \
              --cache-control "$CACHE" \
              --region "$AWS_REGION"
          done

      - name: Sync sitemap + robots
        run: |
          for f in sitemap.xml robots.txt; do
            [ -f "$f" ] && aws s3 cp "$f" "s3://${S3_BUCKET}/$f" \
              --cache-control "public, max-age=3600" \
              --region "$AWS_REGION"
          done

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text
